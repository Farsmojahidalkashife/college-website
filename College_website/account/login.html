<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="صفحة تسجيل الدخول إلى حسابك في موقع كلية العلوم الرياضية والحاسوب.">
  <title>تسجيل الدخول — كلية العلوم الرياضية والحاسوب</title>
</head>
<body>

  <header>
    <div>
      <img src="../assets/images/logo.png" alt="شعار كلية العلوم الرياضية والحاسوب" width="80" height="80">
      <h1>كلية العلوم الرياضية والحاسوب</h1>
      <p>جامعة الجزيرة — السودان</p>
    </div>
  </header>

  <main>
    <section>
      <h2>تسجيل الدخول</h2>
      <form action="#" method="post">
        <div>
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" name="email" required autocomplete="email" autofocus>
        </div>
        <div>
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <div>
          <label>
            <input type="checkbox" name="remember">
            تذكرني
          </label>
        </div>
        <div>
          <button type="submit">دخول</button>
        </div>
      </form>
      <p>ليس لديك حساب؟ <a href="register.html">أنشئ حساباً</a></p>
    </section>
    <nav aria-label="العودة">
      <p><a href="../index.html">← العودة للرئيسية</a></p>
    </nav>
  </main>

  <footer>
    <hr>
    <p dir="rtl"><bdi dir="ltr">&copy; 2026</bdi> كلية العلوم الرياضية والحاسوب — جامعة الجزيرة</p>
  </footer>

</body>
</html>
