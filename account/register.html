<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="أنشئ حساباً جديداً في موقع كلية العلوم الرياضية والحاسوب.">
  <title>إنشاء حساب — كلية العلوم الرياضية والحاسوب</title>
  <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body>

  <header class="header">
    <div class="container">
      <div class="header-brand" style="justify-content: center; text-align: center; margin-bottom: 0;">
        <img src="../assets/images/logo.png" alt="شعار كلية العلوم الرياضية والحاسوب" class="header-logo">
        <div>
          <h1 class="header-title">كلية العلوم الرياضية والحاسوب</h1>
          <p class="header-subtitle">جامعة الجزيرة — السودان</p>
        </div>
      </div>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <h2 class="auth-title">إنشاء حساب جديد</h2>
      <p class="auth-subtitle">انضم إلينا للتواصل ومتابعة الاستفسارات</p>

      <form action="#" method="post" class="auth-form">
        <fieldset class="fieldset">
          <legend class="legend">المعلومات الشخصية</legend>
          <div class="form-group">
            <label for="name" class="form-label">الاسم الكامل</label>
            <input type="text" id="name" name="name" class="form-input" required>
          </div>
          <div class="form-group">
            <label for="email" class="form-label">البريد الإلكتروني</label>
            <input type="email" id="email" name="email" class="form-input" required>
          </div>
        </fieldset>
        <fieldset class="fieldset">
          <legend class="legend">بيانات الدخول</legend>
          <div class="form-group">
            <label for="password" class="form-label">كلمة المرور</label>
            <input type="password" id="password" name="password" class="form-input" required>
          </div>
          <div class="form-group">
            <label for="confirm-password" class="form-label">تأكيد كلمة المرور</label>
            <input type="password" id="confirm-password" name="confirm-password" class="form-input" required>
          </div>
        </fieldset>
        <div class="form-group">
          <label class="form-checkbox">
            <input type="checkbox" name="terms" required>
            أوافق على <a href="../terms.html" target="_blank">الشروط والأحكام</a>
          </label>
        </div>
        <button type="submit" class="btn btn--primary btn--block">إنشاء حساب</button>
      </form>

      <div class="auth-footer">
        <p>لديك حساب؟ <a href="login.html">سجّل دخولك</a></p>
        <p><a href="../index.html" class="back-link">← العودة للرئيسية</a></p>
        <p>© 2026 كلية العلوم الرياضية والحاسوب — جامعة الجزيرة</p>
      </div>
    </div>
  </main>

</body>
</html>
